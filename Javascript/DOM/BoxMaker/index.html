<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .square {
        height: 100px;
        width: 100px;

        margin: 10px;
      }
      .circle {
        height: 100px;
        width: 100px;

        margin: 10px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <input type="text" />

    <input id="color" type="color" />
    <select name="" id="shape">
      <option value="square">Square</option>
      <option value="circle">Circle</option>
    </select>
    <button>Add</button>
    <div class="boxContainer">
      <!-- <div class="square"></div>
      <div class="circle"></div> -->
    </div>
  </body>
  <script>
    const inputTag = document.querySelector("input");
    const buttonTag = document.querySelector("button");
    const container = document.querySelector(".boxContainer");
    const colorInputTag = document.querySelector("#color");
    const shapeInput = document.getElementById("shape");

    // console.log(colorInputTag)
    //  console.dir(inputTag);
    // console.dir(buttonTag);
    // console.dir(container);

    buttonTag.addEventListener("click", function () {
      container.innerHTML = "";
      // console.dir(colorInputTag)
      // console.log(inputTag)

      const numberOfBoxes = inputTag.value;
      const boxColor = colorInputTag.value;
      const shape = shapeInput.value;

      // console.log(shape);

      // console.log(numberOfBoxes);
      for (let i = 1; i <= numberOfBoxes; i++) {
        const boxEle = document.createElement("div");
        boxEle.classList.add(shape);
        boxEle.style.backgroundColor = boxColor;
        container.appendChild(boxEle);
        // console.log(boxEle);
      }
    });
  </script>
</html>
