  <script>
    // Promise -- Promise is object, which is used to do asynchronous task,
    // //it has three states [Pending , fullfilled , reject ]

    let bread = "bread";

    function breadCut(raw) {
      let breadCut = new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (raw) {
            resolve("Beadcut Done");
          } else {
            reject("Reject in bread cut");
          }
        }, 2000);
      });
      return breadCut;
    }

    function AddStuffings(bread) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (bread) {
            resolve("Stuffings done ");
          } else {
            reject("Reject in addStuffings");
          }
        }, 2000);
      });
    }

    function BakeBread(bread) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (bread) {
            resolve("Sandwich ban gaya aake khale ");
          } else {
            reject("Reject in bakeBread");
          }
        }, 2000);
      });
    }

    // Syntax one

   async function makeSandwich() {
      try {
        let cuttedBread = await breadCut("bread");
        console.log(cuttedBread);
        let stuffedBread = await AddStuffings();
        console.log(stuffedBread);
        let sandwich = await BakeBread(stuffedBread);
        console.log(sandwich);
      } catch (err) {
        console.log(err);
      }
    }

    makeSandwich();
