<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4facfe, #00c6ff);
        padding: 20px;
      }

      .weather-app {
        width: 100%;
        max-width: 900px;
        padding: 30px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 35px;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
      }

      .search {
        display: flex;
        width: 350px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 30px;
        overflow: hidden;
      }

      .search input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: white;
        padding: 14px 18px;
        font-size: 15px;
      }

      .search input::placeholder {
        color: rgba(255, 255, 255, 0.8);
      }

      .search button {
        border: none;
        background: white;
        color: #2699f7;
        padding: 0 22px;
        cursor: pointer;
        font-weight: bold;
      }

      /* Main Weather */
      .main-weather {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
      }

      .location {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .date {
        font-size: 14px;
        opacity: 0.8;
      }

      .temperature {
        font-size: 80px;
        font-weight: 300;
        line-height: 1;
        margin: 20px 0 10px;
      }

      .condition {
        font-size: 20px;
        font-weight: 500;
      }

      .weather-icon {
        font-size: 120px;
      }

      /* Weather Details */
      .details {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 35px;
      }

      .detail-card {
        background: rgba(255, 255, 255, 0.16);
        padding: 20px;
        border-radius: 18px;
        text-align: center;
      }

      .detail-icon {
        font-size: 25px;
        margin-bottom: 10px;
      }

      .detail-title {
        font-size: 13px;
        opacity: 0.75;
        margin-bottom: 6px;
      }

      .detail-value {
        font-size: 18px;
        font-weight: bold;
      }

      /* Forecast */
      .forecast-title {
        font-size: 20px;
        margin-bottom: 15px;
      }

      .forecast {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }

      .forecast-card {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        padding: 18px 10px;
        text-align: center;
        transition: 0.3s;
      }

      .forecast-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.25);
      }

      .forecast-day {
        font-size: 14px;
        font-weight: bold;
      }

      .forecast-icon {
        font-size: 35px;
        margin: 12px 0;
      }

      .forecast-temp {
        font-size: 16px;
        font-weight: bold;
      }

      .forecast-low {
        opacity: 0.6;
        margin-left: 5px;
      }

      /* Responsive */
      @media (max-width: 700px) {
        .weather-app {
          padding: 20px;
        }

        .header {
          flex-direction: column;
          align-items: stretch;
        }

        .search {
          width: 100%;
        }

        .main-weather {
          text-align: center;
          flex-direction: column;
        }

        .weather-icon {
          order: -1;
        }

        .temperature {
          font-size: 65px;
        }

        .details {
          grid-template-columns: repeat(2, 1fr);
        }

        .forecast {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="weather-app">
      <header class="header">
        <div class="logo">☁ WeatherNow</div>

        <div class="search">
          <input id="cityInput" type="text" placeholder="Search city..." />

          <button id="searchBtn">Search</button>
        </div>
      </header>

      <section class="main-weather">
        <div class="weather-info">
          <div class="location">📍 Surat, India</div>

          <div class="date">Friday, September 18</div>

          <div class="temperature">28°</div>

          <div class="condition">Partly Cloudy</div>
        </div>

        <img
          class="weather-icon"
          src="//cdn.weatherapi.com/weather/64x64/day/353.png"
          alt=""
        />
      </section>

      <section class="details">
        <div class="detail-card">
          <div class="detail-icon">💧</div>
          <div class="detail-title">Humidity</div>
          <div class="detail-value">68%</div>
        </div>

        <div class="detail-card">
          <div class="detail-icon">💨</div>
          <div class="detail-title">Wind</div>
          <div class="detail-value">14 km/h</div>
        </div>

        <div class="detail-card">
          <div class="detail-icon">🌡️</div>
          <div class="detail-title">Feels Like</div>
          <div class="detail-value">30°</div>
        </div>

        <div class="detail-card">
          <div class="detail-icon">☀️</div>
          <div class="detail-title">UV Index</div>
          <div class="detail-value">6</div>
        </div>
      </section>
    </div>
  </body>
  
</html>
